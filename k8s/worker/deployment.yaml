apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker-service

  template:
    metadata:
      labels:
        app: worker-service

    spec:
      containers:
        - name: worker-service
          image: worker-service

          imagePullPolicy: Never

          ports:
            - containerPort: 4000

          env:
            - name: REDIS_HOST
              value: redis

            - name: REDIS_PORT
              value: "6379"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
